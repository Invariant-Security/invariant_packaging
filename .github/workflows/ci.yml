# Testa os scripts de instalação a cada push: o postinst real roda duas
# vezes num Debian limpo e não pode mudar segredo nem certificado. Usa o
# stub de docker + provision.sh de fixture (o api é privado e os arquivos
# do appliance vêm da imagem); a extração tem teste próprio.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && sh -n scripts/postinst && bash -n build.sh
      - run: tests/postinst_preserves_secrets.sh
      - run: tests/extract_appliance.sh
