# Roda depois das imagens já estarem publicadas (ver publish-image.yml em
# cada repo invariant_*) -- a tag aqui precisa bater com a tag v<versão>
# da imagem do invariant_api: o postinst do .deb extrai dela, na
# instalação, os arquivos do appliance (o build não busca nada do api).
name: build-deb

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fpm
        run: sudo gem install --no-document fpm
      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build.sh "$VERSION"
      - name: Upload as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
